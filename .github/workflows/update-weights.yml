name: Actualitzar pesos MSCI World

on:
  schedule:
    - cron: "0 7 * * 1-5"   # cada dia laborable a les 07:00 UTC
  workflow_dispatch:         # també es pot executar a mà des de la pestanya Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calcular pesos
        run: python update_weights.py
      - name: Desar si hi ha canvis
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add msci-weights.json
          git diff --cached --quiet || (git commit -m "Actualitza pesos MSCI World" && git push)
